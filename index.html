<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#075354" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="حساب من" />
  <meta name="apple-mobile-web-app-title" content="حساب من" />
  <title>حساب من</title>
  <link rel="manifest" href="/manifest.webmanifest?v=11.3.4" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=11.3.4" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=11.3.4" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=11.3.4" />
  <link rel="stylesheet" href="/assets/app-v11.3.4.css" />
  <script>
(() => {
  'use strict';
  const V='v11.3.4';
  const CFG='pfm-supabase-config';
  const SESSION='pfm-supabase-session-v3';
  const DATA='pfm-v9.0.0';
  const SEC='pfm-device-security-v11.3';
  const HIDDEN='pfm-security-hidden-v11.3';

  const FALLBACK_CFG={
    url:'https://clvwnkpphjrrywdiefoe.supabase.co',
    anonKey:'sb_publishable_uI-cpF2zCBfiaxakec-WXw_w-zSvJaT'
  };
  function findLegacyConfig(){
    const direct=read(CFG,null);
    if(direct?.url&&direct?.anonKey)return direct;
    // Try older/local keys and any JSON object that still contains the existing Supabase project.
    const candidates=['pfm-cloud-config','pfm-supabase-config-v1','pfm-supabase-config-v2','supabase-config','hesab-man-supabase'];
    for(const k of candidates){
      const v=read(k,null);
      if(v?.url&&(v?.anonKey||v?.publishableKey||v?.key)){
        return {url:v.url,anonKey:v.anonKey||v.publishableKey||v.key};
      }
    }
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      try{
        const raw=localStorage.getItem(k)||'';
        if(!raw.includes('supabase.co'))continue;
        const v=JSON.parse(raw);
        const url=v?.url||v?.projectUrl||v?.supabaseUrl;
        const key=v?.anonKey||v?.publishableKey||v?.key||v?.supabaseKey;
        if(url&&key)return {url,anonKey:key};
      }catch{}
    }
    return null;
  }
  function ensureCloudConfig(){
    const existing=findLegacyConfig();
    if(existing?.url&&existing?.anonKey){
      if(!read(CFG,null))write(CFG,{url:String(existing.url).replace(/\/+$/,''),anonKey:String(existing.anonKey)});
      return existing;
    }
    // This is the same public project URL + publishable browser key already used by حساب من.
    // Saving it only restores browser connection settings; it does not write/delete financial data.
    write(CFG,FALLBACK_CFG);
    return FALLBACK_CFG;
  }

  const read=(k,f=null)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}};
  const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const sha=async s=>{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  };
  const b64u=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
  const unb64u=v=>{let b=String(v||'').replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);const s=atob(b);return Uint8Array.from(s,c=>c.charCodeAt(0))};
  const chall=()=>crypto.getRandomValues(new Uint8Array(32));
  const webauthn=()=>!!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials?.create&&navigator.credentials?.get);
  const sessionEmail=()=>read(SESSION,{})?.user?.email||'';
  const localPin=()=>String(read(DATA,{})?.settings?.pin||'').replace(/\D/g,'');
  const sec=()=>({face:false,cred:'',salt:'',hash:'',...read(SEC,{})});
  const setSec=v=>write(SEC,v);

  ensureCloudConfig();

  // Show a blocker immediately, before React paints.
  const css=document.createElement('style');
  css.textContent=`
  html.pfmLocked body{overflow:hidden!important}
  #pfmGate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(160deg,#062e33 0%,#0b5354 55%,#eef7f5 55%,#f8fafc 100%);display:flex;align-items:center;justify-content:center;padding:18px;direction:rtl;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
  #pfmGate *{box-sizing:border-box}#pfmGateCard{width:min(430px,94vw);background:rgba(255,255,255,.98);border-radius:28px;padding:25px;box-shadow:0 28px 80px rgba(2,32,36,.28);border:1px solid rgba(255,255,255,.8);text-align:center;color:#0f172a}
  .pfmLogo{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;overflow:hidden;box-shadow:0 10px 30px rgba(15,118,110,.2)}.pfmLogo img{width:100%;height:100%;display:block}
  #pfmGate h1{margin:0;font-size:1.55rem}#pfmGate .ver{display:inline-block;margin-top:7px;padding:4px 9px;border-radius:999px;background:#e6fffa;color:#0f766e;font-weight:800;font-size:.72rem}
  #pfmGate .sub{color:#64748b;margin:8px 0 17px;font-size:.86rem}.pfmFace,.pfmPrimary,.pfmSecondary{width:100%;min-height:52px;border-radius:16px;font-weight:850;font-size:.94rem;cursor:pointer}
  .pfmFace{border:1px solid #99f6e4;background:linear-gradient(145deg,#ecfdf5,#f0fdfa);color:#065f46}.pfmPrimary{border:0;background:#0f766e;color:#fff}.pfmSecondary{border:1px solid #cbd5e1;background:#fff;color:#334155}
  .pfmFace:disabled,.pfmPrimary:disabled{opacity:.6}.pfmDivider{display:flex;align-items:center;gap:10px;margin:15px 0;color:#94a3b8;font-size:.74rem}.pfmDivider:before,.pfmDivider:after{content:"";height:1px;background:#e2e8f0;flex:1}
  .pfmInput{width:100%;height:52px;border:1px solid #cbd5e1;border-radius:15px;padding:0 14px;margin-bottom:10px;font-size:1rem;outline:none}.pfmInput:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .pfmForgot{border:0;background:transparent;color:#0f766e;font-weight:800;margin-top:10px;cursor:pointer;font-size:.82rem}.pfmForgot:disabled{opacity:.55}.pfmForgot,.pfmReconnect{border:0;background:transparent;color:#0f766e;font-weight:850;padding:10px 6px;cursor:pointer}.pfmReconnect{color:#64748b;font-size:.78rem}.pfmMsg{min-height:22px;margin-top:8px;color:#b91c1c;font-size:.8rem;line-height:1.6}.pfmNote{display:block;margin-top:13px;color:#94a3b8;font-size:.7rem;line-height:1.7}.pfmEnroll{display:grid;gap:10px}.pfmEnroll p{color:#475569;line-height:1.85;font-size:.86rem}
  #pfmLockNow{position:fixed;left:12px;top:82px;z-index:99999;width:41px;height:41px;border-radius:13px;border:1px solid #dbe5ef;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.11);font-size:17px;cursor:pointer}
  `;
  document.documentElement.appendChild(css);

  let gate=null,fail=0,blocked=0,unlocked=false;

  function base(){
    const c=document.createElement('div');c.id='pfmGateCard';
    c.innerHTML=`<div class="pfmLogo"><img src="/apple-touch-icon.png?v=11.3.4" alt=""></div><h1>حساب من</h1><span class="ver">${V}</span><div class="sub">ورود امن به اطلاعات مالی</div>`;
    return c;
  }
  function ensureGate(){
    document.documentElement.classList.add('pfmLocked');
    if(!gate){gate=document.createElement('div');gate.id='pfmGate';document.documentElement.appendChild(gate)}
    return gate;
  }
  function unlock(){
    unlocked=true;
    document.documentElement.classList.remove('pfmLocked');
    gate?.remove();gate=null;
    addLockButton();
    document.querySelectorAll('.version').forEach(x=>x.textContent=V);
  }
  function addLockButton(){
    if(document.getElementById('pfmLockNow')||!document.body)return;
    const b=document.createElement('button');b.id='pfmLockNow';b.type='button';b.title='قفل کردن الآن';b.textContent='🔒';
    b.onclick=()=>{unlocked=false;showGate()};
    document.body.appendChild(b);
  }
  async function verifyPassword(password){
    const cfg=ensureCloudConfig(), email=sessionEmail(), s=sec();
    // First prefer online Supabase verification with the same old account password.
    if(cfg?.url&&cfg?.anonKey&&email&&navigator.onLine){
      try{
        const r=await fetch(cfg.url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=password',{
          method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},
          body:JSON.stringify({email,password})
        });
        const body=await r.json().catch(()=>null);
        if(r.ok&&body?.access_token){
          body.expires_at=Math.floor(Date.now()/1000)+Number(body.expires_in||3600);
          write(SESSION,body);
          const salt=s.salt||b64u(crypto.getRandomValues(new Uint8Array(16)));
          setSec({...s,salt,hash:await sha(salt+'|'+password)});
          return true;
        }
        return false;
      }catch{}
    }
    // Offline fallback: same password, hashed locally after one successful online login.
    if(s.salt&&s.hash) return (await sha(s.salt+'|'+password))===s.hash;
    // Legacy local PIN fallback if one exists.
    const pin=localPin();
    if(pin&&password===pin)return true;
    return false;
  }
  async function enrollFace(){
    if(!webauthn())throw new Error('unsupported');
    const email=sessionEmail()||'hesab-man-user';
    let uid=new TextEncoder().encode(email);if(uid.length>64)uid=uid.slice(0,64);
    const cred=await navigator.credentials.create({publicKey:{
      challenge:chall(),rp:{name:'حساب من'},user:{id:uid,name:email,displayName:'حساب من'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',requireResidentKey:false,userVerification:'required'},
      timeout:60000,attestation:'none'
    }});
    if(!cred?.rawId)throw new Error('failed');
    const s=sec();setSec({...s,face:true,cred:b64u(cred.rawId)});
  }
  async function faceLogin(btn,msg){
    const s=sec();
    if(!s.face||!s.cred||!webauthn()){msg.textContent='Face ID / Passkey روی این دستگاه فعال نیست.';return}
    btn.disabled=true;btn.textContent='در حال بررسی…';msg.textContent='';
    try{
      const c=await navigator.credentials.get({publicKey:{challenge:chall(),allowCredentials:[{id:unb64u(s.cred),type:'public-key',transports:['internal']}],userVerification:'required',timeout:60000}});
      if(c)unlock();
    }catch(e){msg.textContent=e?.name==='NotAllowedError'?'Face ID لغو شد؛ با رمز وارد شو.':'Face ID انجام نشد؛ با رمز وارد شو.'}
    finally{if(btn.isConnected){btn.disabled=false;btn.textContent='ورود با Face ID'}}
  }
  function showEnroll(){
    const g=ensureGate(),c=base(),box=document.createElement('div');box.className='pfmEnroll';
    box.innerHTML='<p>رمز حساب تأیید شد. می‌خواهی از این به بعد روی همین iPhone با <b>Face ID</b> وارد شوی؟ رمز قبلی همیشه روش جایگزین باقی می‌ماند.</p>';
    const y=document.createElement('button');y.className='pfmFace';y.textContent='فعال‌سازی Face ID';
    const n=document.createElement('button');n.className='pfmSecondary';n.textContent='فعلاً با رمز ادامه بده';
    const m=document.createElement('div');m.className='pfmMsg';
    y.onclick=async()=>{y.disabled=true;y.textContent='در حال فعال‌سازی…';try{await enrollFace();unlock()}catch(e){m.textContent=e?.name==='NotAllowedError'?'فعال‌سازی لغو شد؛ می‌توانی با رمز ادامه بدهی.':'Face ID / Passkey در این حالت مرورگر در دسترس نیست.';y.disabled=false;y.textContent='فعال‌سازی Face ID'}};
    n.onclick=unlock;box.append(y,n,m);c.appendChild(box);g.replaceChildren(c);
  }
  function recoveryParams(){
    const h=new URLSearchParams(location.hash.replace(/^#/,''));
    const q=new URLSearchParams(location.search);
    return {
      type:h.get('type')||q.get('type')||'',
      access_token:h.get('access_token')||q.get('access_token')||'',
      refresh_token:h.get('refresh_token')||q.get('refresh_token')||''
    };
  }
  async function sendRecovery(msg,btn){
    const cfg=ensureCloudConfig();
    if(!cfg?.url||!cfg?.anonKey){msg.textContent='تنظیمات Supabase پیدا نشد.';return}
    let email=sessionEmail();
    if(!email){
      email=String(prompt('ایمیل همان حساب Supabase را وارد کن:')||'').trim().toLowerCase();
      if(!email)return;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.textContent='فرمت ایمیل صحیح نیست.';return}
    }
    btn.disabled=true;const old=btn.textContent;btn.textContent='در حال ارسال…';msg.textContent='';
    try{
      const redirect=location.origin+location.pathname+'?recovery=1';
      const r=await fetch(cfg.url.replace(/\/+$/,'')+'/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{
        method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email})
      });
      const body=await r.json().catch(()=>null);
      if(!r.ok)throw new Error(body?.msg||body?.message||body?.error_description||'ارسال لینک بازیابی انجام نشد');
      sessionStorage.setItem('pfm-recovery-email',email);
      msg.style.color='#047857';msg.textContent='لینک بازیابی رمز ارسال شد. ایمیل را باز کن و روی لینک بازیابی بزن؛ هیچ اطلاعات مالی حذف یا تغییر نمی‌کند.';
    }catch(e){msg.style.color='#b91c1c';msg.textContent=e?.message||'ارسال لینک بازیابی انجام نشد.'}
    finally{btn.disabled=false;btn.textContent=old}
  }
  function showResetPassword(token,refresh){
    const g=ensureGate(),c=base(),msg=document.createElement('div');msg.className='pfmMsg';
    const title=document.createElement('p');title.style.cssText='color:#475569;line-height:1.8;font-size:.86rem';title.textContent='هویت از طریق ایمیل تأیید شد. رمز جدید حساب را تعیین کن. این کار هیچ تراکنش یا اطلاعات مالی را حذف نمی‌کند.';
    const p1=document.createElement('input');p1.className='pfmInput';p1.type='password';p1.placeholder='رمز جدید (حداقل ۶ کاراکتر)';p1.autocomplete='new-password';
    const p2=document.createElement('input');p2.className='pfmInput';p2.type='password';p2.placeholder='تکرار رمز جدید';p2.autocomplete='new-password';
    const btn=document.createElement('button');btn.className='pfmPrimary';btn.textContent='ذخیره رمز جدید';
    btn.onclick=async()=>{
      if(p1.value.length<6){msg.textContent='رمز جدید حداقل ۶ کاراکتر باشد.';return}
      if(p1.value!==p2.value){msg.textContent='تکرار رمز با رمز جدید یکسان نیست.';return}
      const cfg=ensureCloudConfig();btn.disabled=true;btn.textContent='در حال ذخیره…';msg.textContent='';
      try{
        const r=await fetch(cfg.url.replace(/\/+$/,'')+'/auth/v1/user',{method:'PUT',headers:{apikey:cfg.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p1.value})});
        const body=await r.json().catch(()=>null);if(!r.ok)throw new Error(body?.msg||body?.message||body?.error_description||'تغییر رمز انجام نشد');
        const s=sec(),salt=s.salt||b64u(crypto.getRandomValues(new Uint8Array(16)));setSec({...s,salt,hash:await sha(salt+'|'+p1.value)});
        if(refresh){const old=read(SESSION,{});write(SESSION,{...old,access_token:token,refresh_token:refresh,user:body||old.user,expires_at:Math.floor(Date.now()/1000)+3600})}
        history.replaceState(null,'',location.pathname+'?app=v11.3.4');
        msg.style.color='#047857';msg.textContent='رمز با موفقیت تغییر کرد.';setTimeout(()=>unlock(),700);
      }catch(e){msg.style.color='#b91c1c';msg.textContent=e?.message||'تغییر رمز انجام نشد.';btn.disabled=false;btn.textContent='ذخیره رمز جدید'}
    };
    c.append(title,p1,p2,btn,msg);g.replaceChildren(c);setTimeout(()=>p1.focus(),100);
  }

  function showGate(){
    if(unlocked)return;
    const rec=recoveryParams();
    if(rec.type==='recovery'&&rec.access_token){showResetPassword(rec.access_token,rec.refresh_token);return}
    const g=ensureGate(),c=base(),s=sec(),msg=document.createElement('div');msg.className='pfmMsg';
    if(s.face&&s.cred){
      const face=document.createElement('button');face.className='pfmFace';face.textContent='ورود با Face ID';face.onclick=()=>faceLogin(face,msg);c.appendChild(face);
      const div=document.createElement('div');div.className='pfmDivider';div.innerHTML='<span>یا با رمز حساب</span>';c.appendChild(div);
    }
    const email=sessionEmail();
    if(email){const em=document.createElement('div');em.style.cssText='font-size:.76rem;color:#64748b;margin-bottom:8px;direction:ltr';em.textContent=email;c.appendChild(em)}
    const inp=document.createElement('input');inp.className='pfmInput';inp.type='password';inp.placeholder='رمز قبلی حساب';inp.autocomplete='current-password';
    const btn=document.createElement('button');btn.className='pfmPrimary';btn.textContent='ورود با رمز';
    const go=async()=>{
      if(Date.now()<blocked){msg.textContent=`${Math.ceil((blocked-Date.now())/1000)} ثانیه دیگر امتحان کن.`;return}
      if(!inp.value){msg.textContent='رمز را وارد کن.';return}
      btn.disabled=true;btn.textContent='در حال بررسی…';msg.textContent='';
      const ok=await verifyPassword(inp.value);
      btn.disabled=false;btn.textContent='ورود با رمز';
      if(ok){fail=0;blocked=0;if(!s.face&&webauthn())showEnroll();else unlock()}
      else{fail++;if(fail>=5){fail=0;blocked=Date.now()+30000;msg.textContent='۵ تلاش ناموفق؛ ورود ۳۰ ثانیه موقتاً قفل شد.'}else msg.textContent=`رمز صحیح نیست؛ ${5-fail} تلاش دیگر باقی مانده.`}
    };
    btn.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
    c.append(inp,btn,msg);
    const forgot=document.createElement('button');forgot.type='button';forgot.className='pfmForgot';forgot.textContent='رمز را فراموش کرده‌ام';forgot.onclick=()=>sendRecovery(msg,forgot);c.appendChild(forgot);
    const reconnect=document.createElement('button');reconnect.type='button';reconnect.className='pfmReconnect';reconnect.textContent='بررسی اتصال فضای ابری';reconnect.onclick=()=>{
      const cfg=ensureCloudConfig();
      msg.style.color='#047857';
      msg.textContent=cfg?.url?'اتصال پروژه Supabase بازیابی شد. حالا «رمز را فراموش کرده‌ام» را بزن.':'اتصال پیدا نشد.';
    };c.appendChild(reconnect);
    const note=document.createElement('small');note.className='pfmNote';note.textContent='این همان رمز قبلی حساب ابری است. بعد از یک ورود موفق، در حالت آفلاین هم قابل بررسی خواهد بود.';c.appendChild(note);
    g.replaceChildren(c);setTimeout(()=>{if(!s.face)inp.focus()},120);
  }

  // Update old visible version labels if React renders them.
  new MutationObserver(()=>{document.querySelectorAll('.version').forEach(x=>x.textContent=V);if(unlocked)addLockButton()})
    .observe(document.documentElement,{subtree:true,childList:true,characterData:true});

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden')sessionStorage.setItem(HIDDEN,String(Date.now()));
    if(document.visibilityState==='visible'){unlocked=false;showGate()}
  });

  // Execute whether script loaded before or after DOMContentLoaded.
  const start=()=>{unlocked=false;showGate()};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
  <script type="module" crossorigin src="/assets/app-v11.3.4.js"></script>
</head>
