<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#075354" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="حساب من" />
  <meta name="apple-mobile-web-app-title" content="حساب من" />
  <title>حساب من</title>
  <link rel="manifest" href="/manifest.webmanifest?v=11.4.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=11.4.0" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=11.4.0" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=11.4.0" />
  <link rel="stylesheet" href="/assets/app-v11.4.1.css" />
  <script>
(() => {
  'use strict';
  const V='v11.4.1';
  const CFG='pfm-supabase-config';
  const FALLBACK_CFG={
    url:'https://clvwnkpphjrrywdiefoe.supabase.co',
    anonKey:'sb_publishable_uI-cpF2zCBfiaxakec-WXw_w-zSvJaT'
  };
  const read=(k,f=null)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}};
  const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  function findLegacyConfig(){
    const direct=read(CFG,null);
    if(direct?.url&&direct?.anonKey)return direct;
    const candidates=['pfm-cloud-config','pfm-supabase-config-v1','pfm-supabase-config-v2','supabase-config','hesab-man-supabase'];
    for(const k of candidates){
      const v=read(k,null);
      if(v?.url&&(v?.anonKey||v?.publishableKey||v?.key))return {url:v.url,anonKey:v.anonKey||v.publishableKey||v.key};
    }
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      try{
        const raw=localStorage.getItem(k)||'';
        if(!raw.includes('supabase.co'))continue;
        const v=JSON.parse(raw);
        const url=v?.url||v?.projectUrl||v?.supabaseUrl;
        const key=v?.anonKey||v?.publishableKey||v?.key||v?.supabaseKey;
        if(url&&key)return {url,anonKey:key};
      }catch{}
    }
    return null;
  }
  const existing=findLegacyConfig();
  write(CFG,{url:'https://clvwnkpphjrrywdiefoe.supabase.co',anonKey:String(existing?.anonKey||FALLBACK_CFG.anonKey)});

  // Password/PIN/Face-ID gate intentionally removed by user request.
  // Existing cloud session remains untouched so sync can keep working.
  try{
    const data=read('pfm-v9.0.0',null);
    if(data?.settings){
      data.settings.pin='';
      data.settings.autoLock=false;
      write('pfm-v9.0.0',data);
    }
  }catch{}

  const applyVersion=()=>document.querySelectorAll('.version').forEach(x=>x.textContent=V);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(applyVersion,0),{once:true});
  else setTimeout(applyVersion,0);
})();
</script>
  <script type="module" crossorigin src="/assets/app-v11.4.1.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
